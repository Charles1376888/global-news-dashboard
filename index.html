<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Global News</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1a2e">
<link rel="manifest" href="./manifest_dash.json">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#1a1a2e;color:#e0e0e0;overflow:hidden}

#app{display:flex;flex-direction:column;height:100%}
#header{background:#16213e;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #0f3460}
#header h1{font-size:16px;font-weight:600}
#header .stat{font-size:11px;color:#888}

#toolbar{background:#16213e;padding:8px 12px;border-bottom:1px solid #0f3460;overflow-x:auto;white-space:nowrap}
#toolbar::-webkit-scrollbar{display:none}
.t-btn{display:inline-block;padding:5px 12px;border-radius:12px;font-size:11px;border:1px solid #0f3460;background:none;color:#888;cursor:pointer;margin-right:6px}
.t-btn.on{background:#00d2ff;color:#1a1a2e;border-color:#00d2ff}
.t-btn.refresh{background:none;border-color:#f08c00;color:#f08c00}

#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px}

.news-card{background:#16213e;border-radius:10px;padding:14px;margin-bottom:10px;cursor:pointer}
.news-card .top{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.news-card .country{font-size:9px;padding:1px 6px;border-radius:4px;background:#0d2b1e;color:#4caf91}
.news-card .src{font-size:10px;color:#00d2ff}
.news-card .time{font-size:10px;color:#666}
.news-card .heat{font-size:10px;color:#ff922b;margin-left:auto}
.news-card .ttl{font-size:14px;line-height:1.5;margin-bottom:6px;color:#e0e0e0}
.news-card .sum{font-size:12px;color:#888;line-height:1.5;margin-bottom:6px}
.news-card .tags{display:flex;gap:4px;flex-wrap:wrap}
.news-card .tags span{font-size:9px;padding:2px 8px;border-radius:8px;background:#0d1b3e;color:#666}
.news-card .tags span.en{background:#0d2b1e;color:#4caf91}

.loading{text-align:center;padding:40px;color:#666}
.loading::after{content:'Loading news...'}
.empty{text-align:center;color:#666;padding:40vh 20px;font-size:14px}
.error{background:#3d1418;color:#f48771;padding:16px;border-radius:8px;text-align:center}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#00d2ff;color:#1a1a2e;padding:8px 20px;border-radius:16px;font-size:12px;font-weight:600;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
<div id="header">
  <h1>&#127760; Global News</h1>
  <span class="stat" id="status">Loading...</span>
</div>
<div id="toolbar">
  <button class="t-btn on" data-sort="heat" onclick="setSort('heat')">&#128293; Hot</button>
  <button class="t-btn" data-sort="time" onclick="setSort('time')">&#9200; Newest</button>
  <button class="t-btn" data-sort="country" onclick="setSort('country')">&#127757; Country</button>
  <span id="countryBtns"></span>
  <span id="tagBtns"></span>
  <button class="t-btn refresh" onclick="refresh()">&#8635; Refresh</button>
  <button class="t-btn" id="fullscreen-btn" onclick="toggleFullscreen()" title="Fullscreen">&#9974;</button>
  <button class="t-btn" id="install-btn" style="display:none" onclick="installApp()">+ Add to Home Screen</button>
</div>
<div id="install-guide" style="display:none;background:#16213e;border:1px solid #f08c00;border-radius:10px;padding:12px;margin:0 12px 12px;font-size:13px;color:#ccc;line-height:1.8">
  <b style="color:#f08c00">Add to Home Screen:</b><br>
  <span id="guide-text"></span>
</div>
<div id="content">
  <div class="loading"></div>
</div>
<div class="toast" id="toast"></div>
</div>

<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
let currentSort='heat',currentCountry='',currentTag='',newsCache=[],newsLastFetch=0;
const NEWS_TTL=30*60*1000;

// ==================== News Engine (Client-side) ====================
const TAG_RULES=[
  {tag:'光伏',keys:['solar','光伏','太阳能','photovoltaic','硅料','硅片','组件']},
  {tag:'风电',keys:['wind','风电','风机','海上风电','陆上风电','offshore wind']},
  {tag:'储能',keys:['storage','储能','电池储能','battery storage','bess']},
  {tag:'锂电',keys:['lithium','锂电','锂电池','锂矿','碳酸锂','宁德时代','比亚迪','catl','byd']},
  {tag:'氢能',keys:['hydrogen','氢能','氢燃料','电解水','绿氢','燃料电池']},
  {tag:'电动车',keys:['ev','电动','电动车','新能源车','tesla','特斯拉','蔚来','小鹏','理想','充电桩']},
  {tag:'油气',keys:['oil','gas','石油','天然气','原油','opec','lng']},
  {tag:'核能',keys:['nuclear','核能','核电站','核电','fusion','uranium']},
  {tag:'AI',keys:['ai','人工智能','chatgpt','gpt','llm','大模型','deepseek','openai','深度学习']},
  {tag:'芯片',keys:['chip','芯片','半导体','nvidia','英伟达','台积电','tsmc','英特尔']},
  {tag:'地缘',keys:['war','战争','冲突','制裁','sanction','关税','tariff','贸易战','俄乌','中东','北约']},
  {tag:'金融',keys:['stock','股市','股票','a股','港股','美股','利率','加息','降息','美联储','央行','crypto','加密','比特币']},
  {tag:'气候',keys:['climate','气候','碳排放','碳交易','碳中和','碳达峰','net zero']},
  {tag:'太空',keys:['space','太空','航天','spacex','nasa','火箭','卫星','星链']},
  {tag:'生物',keys:['医药','疫苗','基因','crispr','生物','pharma','癌症']},
];

const RSS_SOURCES=[
  {name:'36氪',url:'https://36kr.com/feed',tags:['科技','商业','新能源']},
  {name:'36氪快讯',url:'https://rsshub.rssforever.com/36kr/newsflashes',tags:['科技','快讯','实时']},
  {name:'华尔街见闻',url:'https://rsshub.rssforever.com/wallstreetcn/news/global',tags:['财经','能源','政策']},
  {name:'财联社',url:'https://rsshub.rssforever.com/cls/depth/1000',tags:['财经','能源','深度']},
  {name:'联合早报',url:'https://rsshub.rssforever.com/zaobao/realtime/china',tags:['中国','时政','财经']},
  {name:'北极星光伏',url:'https://guangfu.bjx.com.cn/rss.aspx',tags:['光伏','新能源']},
  {name:'北极星储能',url:'https://chuneng.bjx.com.cn/rss.aspx',tags:['储能','新能源']},
  {name:'北极星风电',url:'https://fd.bjx.com.cn/rss.aspx',tags:['风电','新能源']},
  {name:'华夏能源网',url:'https://www.hxny.com/rss/',tags:['能源','新能源','政策']},
  {name:'南方能源建设',url:'https://www.energychina.press/rss/current.xml',tags:['能源','学术','工程']},
];

function extractKeywords(text){
  const cnWords=text.match(/[一-鿿]{2,}/g)||[];
  const words=text.toLowerCase().replace(/[^\w\s]/g,' ').split(/\s+/).filter(w=>w.length>=2);
  return [...new Set([...words,...cnWords])].slice(0,20);
}

function tagNewsItem(title,snippet){
  const text=(title+' '+(snippet||'')).toLowerCase();
  const tags=[];
  for(const rule of TAG_RULES){
    for(const key of rule.keys){
      if(text.includes(key)){tags.push(rule.tag);break;}
    }
  }
  return [...new Set(tags)];
}

async function fetchWeibo(){
  try{
    const ctrl=new AbortController();
    setTimeout(()=>ctrl.abort(),5000);
    const r=await fetch('https://weibo.com/ajax/side/hotSearch',{
      signal:ctrl.signal,
      headers:{'User-Agent':'Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/120.0.0.0 Mobile Safari/537.36','Referer':'https://weibo.com/'}
    });
    if(!r.ok)return[];
    const d=await r.json();
    const topics=d?.data?.realtime||[];
    const items=[];
    const now=new Date().toISOString();
    for(const t of topics.slice(0,50)){
      if(!t.word)continue;
      const tags=tagNewsItem(t.word,t.note||'');
      items.push({
        _id:'wb|'+t.word,title:t.word,
        link:'https://s.weibo.com/weibo?q='+encodeURIComponent(t.word),
        snippet:(t.note||'').slice(0,200),pubDate:now,
        source:'微博热搜',country:'中国',allCountries:['中国'],
        sourceTags:['热搜','实时'],tags:tags.length?tags:['热议'],
        _keywords:extractKeywords(t.word+' '+(t.note||'')),
        _cn:true,_heatBase:Math.round((t.num||100000)/100000),
      });
    }
    return items;
  }catch(e){return[];}
}

async function fetchRSS(source){
  try{
    const ctrl=new AbortController();
    setTimeout(()=>ctrl.abort(),4000);
    const r=await fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(source.url),{signal:ctrl.signal});
    if(!r.ok)return[];
    const d=await r.json();
    if(d.status!=='ok')return[];
    const items=[];
    for(const item of(d.items||[]).slice(0,30)){
      const d2=new Date(item.pubDate);
      if(!isNaN(d2.getTime())&&d2.getTime()<Date.now()-7*86400000)continue;
      const tags=tagNewsItem(item.title,item.description||'');
      items.push({
        _id:source.name+'|'+(item.link||item.title),
        title:item.title||'',link:item.link||'',
        snippet:(item.description||'').replace(/<[^>]+>/g,'').slice(0,200),
        pubDate:item.pubDate||'',source:source.name,
        country:'中国',allCountries:['中国'],
        sourceTags:source.tags,tags:tags,
        _keywords:extractKeywords((item.title||'')+' '+(item.description||'')),
        _cn:true,
      });
    }
    return items;
  }catch(e){return[];}
}

function clusterAndScore(items){
  const clusters=[],used=new Set();
  for(let i=0;i<items.length;i++){
    if(used.has(i))continue;
    const cluster=[items[i]];used.add(i);
    const kwi=new Set(items[i]._keywords||[]);
    for(let j=i+1;j<items.length;j++){
      if(used.has(j))continue;
      const kwj=new Set(items[j]._keywords||[]);
      if([...kwi].filter(k=>kwj.has(k)).length>=3){cluster.push(items[j]);used.add(j);}
    }
    clusters.push(cluster);
  }
  const result=[];
  for(const cluster of clusters){
    const cnBoost=cluster.some(i=>i._cn)?1:0;
    const weiboHeat=cluster.reduce((s,i)=>s+(i._heatBase||0),0);
    const heat=cluster.length+cnBoost+weiboHeat;
    for(const item of cluster.slice(0,2))result.push({...item,heat});
  }
  return result;
}

async function fetchNewsJSON(){
  try{
    const ctrl=new AbortController();
    setTimeout(()=>ctrl.abort(),8000);
    const r=await fetch('./news.json',{signal:ctrl.signal,cache:'no-cache'});
    if(!r.ok)return[];
    const d=await r.json();
    return d.items||[];
  }catch(e){return[];}
}

async function fetchAllNews(){
  // Primary: server-side pre-fetched news.json (GitHub Actions)
  const jsonItems=await fetchNewsJSON();
  // Secondary: client-side live fetch for freshness
  const allItems=[...jsonItems];
  const seen=new Set(allItems.map(i=>i._id));
  const results=await Promise.allSettled([
    fetchWeibo(),
    ...RSS_SOURCES.map(s=>fetchRSS(s))
  ]);
  for(const r of results){
    if(r.status==='fulfilled'&&r.value.length){
      for(const item of r.value){
        if(!seen.has(item._id)){allItems.push(item);seen.add(item._id);}
      }
    }
  }
  if(!allItems.length){
    const cached=localStorage.getItem('news_cache');
    if(cached)return JSON.parse(cached).items||[];
    return[];
  }
  const clustered=clusterAndScore(allItems);
  try{localStorage.setItem('news_cache',JSON.stringify({items:clustered,ts:Date.now()}));}catch(e){}
  return clustered;
}

// ==================== UI ====================
function setSort(s){
  currentSort=s;currentCountry='';currentTag='';
  $$('#toolbar .t-btn[data-sort]').forEach(b=>b.classList.toggle('on',b.dataset.sort===s));
  $('#countryBtns').innerHTML='';
  if(s==='country'){$('#countryBtns').style.display='';loadCountries();}
  else $('#countryBtns').style.display='none';
  renderFiltered();
}

async function loadCountries(){
  let h='';
  const countries=[...new Set(newsCache.flatMap(i=>i.allCountries||[]))].sort();
  countries.forEach(c=>h+=`<button class="t-btn" onclick="selectCountry('${c}')">${c}</button>`);
  $('#countryBtns').innerHTML=h;
}

function selectCountry(c){
  currentCountry=c;
  $$('#countryBtns .t-btn').forEach(b=>b.classList.toggle('on',b.textContent===c));
  renderFiltered();
}

function selectTag(t){
  currentTag=(t===currentTag)?'':t;
  $$('#tagBtns .t-btn').forEach(b=>b.classList.toggle('on',b.textContent===t&&currentTag===t));
  renderFiltered();
}

async function refresh(){
  showToast('Refreshing...');
  $('#status').textContent='Fetching...';
  newsCache=await fetchAllNews();
  newsLastFetch=Date.now();
  renderFiltered();
  showToast(newsCache.length+' items loaded!');
}

async function loadNews(){
  $('#content').innerHTML='<div class="loading"></div>';
  // 1st: try server-side news.json (fast, reliable)
  const jsonItems=await fetchNewsJSON();
  if(jsonItems.length){newsCache=jsonItems;newsLastFetch=Date.now();renderFiltered();}
  // 2nd: fallback to localStorage cache
  if(!newsCache.length){
    const cached=localStorage.getItem('news_cache');
    if(cached){
      try{
        const c=JSON.parse(cached);
        if(c.items&&c.items.length&&(Date.now()-c.ts)<NEWS_TTL){
          newsCache=c.items;newsLastFetch=c.ts;
        }
      }catch(e){}
    }
  }
  if(newsCache.length)renderFiltered();
  // 3rd: live fetch for freshness + merge
  const fresh=await fetchAllNews();
  if(fresh.length){newsCache=fresh;newsLastFetch=Date.now();}
  renderFiltered();
}

function renderFiltered(){
  let items=[...newsCache];
  if(currentTag)items=items.filter(i=>i.tags.includes(currentTag));
  if(currentCountry)items=items.filter(i=>i.country===currentCountry||(i.allCountries||[]).includes(currentCountry));
  if(currentSort==='time'){
    items.sort((a,b)=>new Date(b.pubDate||0)-new Date(a.pubDate||0));
  }else{
    items.sort((a,b)=>(b.heat||0)-(a.heat||0)||(new Date(b.pubDate||0)-new Date(a.pubDate||0)));
  }
  renderNews(items);
  renderTags();
  const now=new Date();
  let s=newsCache.length+' items';
  if(newsLastFetch){
    const mins=Math.round((now-newsLastFetch)/60000);
    s+=' · '+(mins<1?'just now':mins+'m ago');
  }
  $('#status').textContent=s;
}

function renderTags(){
  const allTags=[...new Set(newsCache.flatMap(i=>i.tags))].sort();
  let h='';
  allTags.slice(0,15).forEach(t=>{
    h+=`<button class="t-btn${t===currentTag?' on':''}" onclick="selectTag('${t}')">${t}</button>`;
  });
  $('#tagBtns').innerHTML=h;
}

function renderNews(items){
  if(!items.length){
    $('#content').innerHTML='<div class="empty">No news yet. Tap Refresh to fetch the latest.</div>';
    return;
  }
  let html='';
  items.slice(0,200).forEach(item=>{
    const d=new Date(item.pubDate);
    const ds=isNaN(d.getTime())?'':d.toLocaleDateString('zh-CN',{month:'short',day:'numeric'});
    const heatStars=item.heat>=5?'&#128293;'.repeat(Math.min(item.heat,5)):'';
    const linkEnc=item.link.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
    html+=`
    <div class="news-card" data-link="${linkEnc}" onclick="event.stopPropagation();window.open(this.dataset.link)">
      <div class="top">
        ${item.country?`<span class="country">${item.country}</span>`:''}
        <span class="src">${item.source}</span>
        <span class="time">${ds}</span>
        ${item.heat>=2?`<span class="heat">${heatStars}</span>`:''}
      </div>
      <div class="ttl">${item.title}</div>
      ${item.snippet?`<div class="sum">${item.snippet}</div>`:''}
      <div class="tags">
        ${(item.sourceTags||[]).map(t=>`<span>${t}</span>`).join('')}
        ${(item.tags||[]).slice(0,4).map(t=>`<span class="en">${t}</span>`).join('')}
      </div>
    </div>`;
  });
  $('#content').innerHTML=html;
}

function showToast(msg){
  const t=$('#toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}

loadNews();

// Browser detection + Fullscreen + PWA Install
const ua=navigator.userAgent;
const isIOS=/iPad|iPhone|iPod/.test(ua);
const isChrome=/Chrome/.test(ua)&&!/Edge|OPR|baidu|QQ|UCBrowser|Samsung|2345/.test(ua);
const isBaidu=/baidu/i.test(ua);
const isQQ=/QQBrowser/i.test(ua);
const isUC=/UCBrowser/i.test(ua);
const isWechat=/MicroMessenger/i.test(ua);
const isEdge=/Edg/.test(ua);
const isStandalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
let deferredPrompt;

window.toggleFullscreen=function(){
  if(document.fullscreenElement){
    document.exitFullscreen();
    showToast('Exited fullscreen');
  }else{
    document.documentElement.requestFullscreen().then(()=>{
      showToast('Fullscreen -- swipe down to exit');
    }).catch(()=>{
      showToast('Fullscreen not supported by browser');
    });
  }
};

function showGuide(){
  if(isStandalone)return;
  const g=document.getElementById('install-guide');
  const t=document.getElementById('guide-text');
  g.style.display='';
  const url=location.protocol+'//'+location.host;
  if(isChrome||isEdge){
    t.innerHTML='Tap browser menu <b>(⋮)</b> → <b>"Install App"</b> or <b>"Add to Home Screen"</b>';
  }else if(isBaidu||isQQ||isUC){
    t.innerHTML=`
      <b style="color:#f08c00">百度浏览器不支持添加到桌面</b><br><br>
      Tap one of these to open in a browser that supports it:<br>
      <a href="intent://${location.host}/#Intent;scheme=http;package=com.android.chrome;end" style="display:inline-block;margin:6px 4px;padding:6px 14px;background:#007acc;color:#fff;border-radius:8px;text-decoration:none;font-size:13px">Open in Chrome</a>
      <a href="intent://${location.host}/#Intent;scheme=http;end" style="display:inline-block;margin:6px 4px;padding:6px 14px;background:#0f3460;color:#fff;border-radius:8px;text-decoration:none;font-size:13px">Open in System Browser</a>
      <br><span style="font-size:11px;color:#888">Or tap ⛴ above for fullscreen mode</span>`;
  }else if(isWechat){
    t.innerHTML='WeChat blocked: Tap <b>⋯</b> → <b>"Open in Browser"</b> first, then add from browser menu';
  }else if(isIOS){
    t.innerHTML='Tap <b>Share</b> icon (middle button at bottom) → <b>"Add to Home Screen"</b>';
  }else{
    t.innerHTML=`
      Open this page in <b>Chrome</b> to install as App:<br>
      <a href="googlechrome://${url}" style="display:inline-block;margin:6px 0;padding:6px 14px;background:#007acc;color:#fff;border-radius:8px;text-decoration:none;font-size:13px">Open in Chrome</a>`;
  }
}

function updateInstallBtn(){
  if(isStandalone)return;
  const btn=document.getElementById('install-btn');
  btn.style.display='';
  if(deferredPrompt){
    btn.classList.add('on');
    btn.textContent='Add to Home Screen';
  }else{
    btn.textContent='How to Install';
    btn.style.borderColor='#f08c00';btn.style.color='#f08c00';
  }
}

window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  deferredPrompt=e;
  updateInstallBtn();
});

window.addEventListener('appinstalled',()=>{
  document.getElementById('install-btn').style.display='none';
  document.getElementById('install-guide').style.display='none';
  showToast('Installed!');
});

window.installApp=async function(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    const{outcome}=await deferredPrompt.userChoice;
    if(outcome==='accepted'){document.getElementById('install-btn').style.display='none';document.getElementById('install-guide').style.display='none';showToast('Installed!')}
    deferredPrompt=null;
    return;
  }
  const g=document.getElementById('install-guide');
  if(g.style.display==='none'||!g.style.display){showGuide()}else{g.style.display='none'}
};

if('serviceWorker' in navigator&&(isChrome||isEdge)){
  navigator.serviceWorker.register('./sw-dash.js').then(reg=>{
    if(reg.waiting){reg.waiting.postMessage('skipWaiting');}
    updateInstallBtn();
  }).catch(()=>{});
}

setTimeout(updateInstallBtn,1500);
if(!isChrome&&!isEdge&&!isStandalone){setTimeout(showGuide,3000);}
</script>
</body>
</html>
