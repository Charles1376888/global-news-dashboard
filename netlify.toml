[build]
  command = "npm install"
  publish = "."

[build.environment]
  NODE_VERSION = "18"

[[headers]]
  for = "/manifest_dash.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw-dash.js"
  [headers.values]
    Service-Worker-Allowed = "/"
    Cache-Control = "no-cache"
